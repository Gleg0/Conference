{% extends "base.html" %}
{% block title %}User List{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Users</h2>

    <form method="get" class="mb-3 d-flex gap-2">
        <select name="role" class="form-select w-auto">
            <option value="">All roles</option>
            <option value="USER" {% if role_filter == "USER" %}selected{% endif %}>User</option>
            <option value="MODERATOR" {% if role_filter == "MODERATOR" %}selected{% endif %}>Moderator</option>
            <option value="SPEAKER" {% if role_filter == "SPEAKER" %}selected{% endif %}>Speaker</option>
        </select>
        <button type="submit" class="btn btn-primary">Filter</button>
    </form>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.role }}</td>
                <td>
                    <a href="{% url 'conferences:change_role' user.id %}" class="btn btn-sm btn-warning">Change Role</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
