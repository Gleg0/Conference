{% extends "base.html" %}
{% block title %}Change Role{% endblock %}
{% load static %}
<script src="{% static 'js/back.js' %}"></script>
{% block content %}
    <div class="container">
        <h2 class="mb-4">Change Role for {{ user_obj.username }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.role }}
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'conferences:user_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
    <a href="#" id="back-btn" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
