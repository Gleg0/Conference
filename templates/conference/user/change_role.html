{% extends "base.html" %}
{% block title %}Change Role{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Change Role for {{ user_obj.username }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.role }}
        <div class="mt-3">
            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'conferences:user_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
