{% extends "base.html" %}
{% block title %}Add Review{% endblock %}
{% load static %}
{% block content %}
    <div class="card shadow p-4">
        <h3 class="mb-3">Add Review for {{ paper.title }}</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="invalid-feedback d-block">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-plus-circle me-2"></i>Create
                </button>
            </div>
        </form>
    </div>
    <a href="#" id="back-btn" class="btn btn-secondary mt-3">Back</a>
    <script src="{% static 'conference/js/back.js' %}"></script>
{% endblock %}
